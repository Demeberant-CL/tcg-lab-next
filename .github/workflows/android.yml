name: Android verification

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon
      - name: Verify INTERNET permission in APK
        run: |
          # Extract binary AndroidManifest and search for the permission string
          unzip -p app/build/outputs/apk/debug/app-debug.apk AndroidManifest.xml | strings | grep -q "android.permission.INTERNET"
          echo "INTERNET permission verified"
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: TCG-LAB-NEXT-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
