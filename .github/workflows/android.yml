name: Android verification

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Verify Gradle
        run: ./gradlew --version
      - name: Lint
        run: ./gradlew lint --no-daemon
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon
      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon
      - name: Verify INTERNET permission in APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          AAPT2="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)/aapt2"
          test -x "$AAPT2"
          "$AAPT2" dump permissions "$APK" | grep -q 'android.permission.INTERNET'
          "$AAPT2" dump permissions "$APK" | grep -q 'android.permission.ACCESS_NETWORK_STATE'
          echo "APK permissions verified"
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: TCG-LAB-NEXT-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
